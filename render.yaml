services:
  - type: web
    name: news-sentiment-analyzer-2
    runtime: node
    rootDir: .
    buildCommand: cd frontend && npm install --include=dev && npm run build && cd ../backend && npm install --include=dev
    startCommand: cd backend && node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
